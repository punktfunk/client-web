[package]
name = "punktfunk-client-web-server"
description = "Serves the punktfunk browser client and proxies each host's management API on the page's own origin."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/punktfunk/client-web"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
# A host's attestation carries its certificate in base64.
base64 = "0.22"
# The listener's header-read timeout needs hyper's timer.
hyper-util = { version = "0.1", features = ["tokio"] }
# A pass is random, and kept as its SHA-256.
getrandom = "0.3"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
# The browse behind pf-client-core's discovery, used directly: that crate would bring core's whole
# QUIC stack (and libopus) along on Linux for thirty lines of mDNS.
mdns-sd = "0.21"
# Which interface a route leaves by, and which addresses are this machine's own. Link-local ones
# count too.
if-addrs = { version = "0.15", features = ["link-local"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The bridge dials the plane the way a browser does (`bridge/plane.rs`). aws-lc-rs, the provider
# core's `tls` installs: a second rustls provider in the tree makes `ClientConfig::builder()` panic.
wtransport = { version = "0.7", default-features = false, features = ["aws-lc-rs"] }
# The same PinVerify and address ranking the native clients use, and the route table, address
# classes and plane attestation check the host itself reads. The same rev as packages/stream.
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", rev = "28c3121022d22a4b1780e7ba00acc1a1ed9c03d4", default-features = false, features = ["tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
# A loopback plane for the bridge tests: `Identity::self_signed`.
wtransport = { version = "0.7", default-features = false, features = ["aws-lc-rs", "self-signed"] }

[profile.release]
lto = "thin"
strip = true
