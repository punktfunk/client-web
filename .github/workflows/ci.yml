name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The TypeScript half of both packages. `node --test` runs the `.ts` files directly by
  # stripping types, so the tests need no build — but `tsc --noEmit` still has to pass, because
  # stripping types does not check them.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `@punktfunk/host` comes from the Gitea npm registry (`.npmrc` names the scope). Reads
      # are anonymous there, so no secret is needed to install.
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The screens as Storybook renders them, without the wasm: the stories never start the
      # engine, so this proves the shell and its fixtures on every push.
      - run: npm run build-storybook -w punktfunk-web

  # The Rust half that does not need emscripten: the credential ceremony and the signature
  # encodings. These are the pieces where the client and the host can disagree silently, which
  # is why they build off wasm at all.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stream
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/stream
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The real artefacts: the library and the app. Skia is source-built for this target (see the
  # README), so the cache is the difference between four minutes and forty.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/stream
      # Keyed on the crate manifest, because that is what decides the archive's key.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/punktfunk/skia-wasm
          key: skia-wasm-${{ hashFiles('packages/stream/Cargo.toml') }}
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: punktfunk-stream
          path: packages/stream/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: punktfunk-web
          path: apps/web/dist/
