name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The TypeScript half. `node --test` runs the `.ts` files directly by stripping types, so the
  # tests need no build — but `tsc --noEmit` still has to pass, because stripping types does not
  # check them.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The Rust half that does not need emscripten: the credential ceremony and the signature
  # encodings. These are the pieces where the client and the host can disagree silently, which is
  # why they build off wasm at all.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The real artefact. Skia is source-built for this target (see README), so the cache is the
  # difference between four minutes and forty.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.9
      - uses: Swatinem/rust-cache@v2
      # Keyed on the skia-safe version, because that is what decides the archive's key.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/punktfunk/skia-wasm
          key: skia-wasm-${{ hashFiles('Cargo.toml') }}
      - run: ./build.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: client-web-dist
          path: dist/
