name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The TypeScript half of both packages. `node --test` runs the `.ts` files directly by
  # stripping types, so the tests need no build — but `tsc --noEmit` still has to pass, because
  # stripping types does not check them.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `@punktfunk/host` comes from the Gitea npm registry (`.npmrc` names the scope). Reads
      # are anonymous there, so no secret is needed to install.
      - run: npm ci
      # The page's messages come from the pinned monorepo's checkout, which cargo finds
      # (`scripts/l10n-messages.mjs`, run by the app's `check`, `test` and `build`).
      - run: rustup toolchain install
        working-directory: packages/stream
      - run: npm run check
      - run: npm test
      # The screens as Storybook renders them, without the wasm: the stories never start the
      # engine, so this proves the shell and its fixtures on every push.
      - run: npm run build-storybook -w punktfunk-web
      # The same screens as pixels, attached to the run: every story at a desktop and a phone
      # width, for a person to look at. Not asserted — a cascade's last frame and a font's
      # arrival make a pixel diff flap.
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots -w punktfunk-web
      - uses: actions/upload-artifact@v7
        with:
          name: punktfunk-web-screens
          path: apps/web/screenshots/

  # The Rust half. Natively: the credential ceremony and the signature encodings, where the
  # client and the host can disagree silently. On wasm: clippy over everything else, which only
  # compiles there. Neither links, so neither needs emsdk.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stream
    env:
      SKIA_BINARIES_URL: https://git.unom.io/api/packages/unom/generic/skia-binaries/0.153.3/skia-binaries-{key}.tar.gz
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml: the pinned rustc, rustfmt, clippy and the wasm target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/stream
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-emscripten -- -D warnings
      - run: cargo test

  # The server that serves the page and proxies the hosts' API (server/).
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The real artefacts: the library and the app, release wasm. Skia comes prebuilt (build.sh).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git describe` names the build on the settings sheet; it needs the tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.10
      - run: rustup toolchain install
        working-directory: packages/stream
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/stream
      - run: npm ci
      - run: npm run build
      # The packed library, installed into an empty Vite project: the consumer's view.
      - run: ./scripts/pack-gate.sh
      - uses: actions/upload-artifact@v7
        with:
          name: punktfunk-stream
          path: packages/stream/dist/
      - uses: actions/upload-artifact@v7
        with:
          name: punktfunk-web
          path: apps/web/dist/

  # A `v*` tag publishes the app as a tarball on the GitHub release, once every check has passed.
  release:
    needs: [build, web, check, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: punktfunk-web
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tarball="punktfunk-client-web-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$tarball" -C dist .
          gh release create "$GITHUB_REF_NAME" "$tarball" --verify-tag --generate-notes

  # The container: the server compiled natively on each architecture's runner, the client from the
  # build job. Each architecture is pushed by digest, with no tag, and `manifest` names this run's
  # two. Pull requests build it without pushing. Pushing needs the UNOM_REGISTRY_USER and
  # UNOM_REGISTRY_TOKEN secrets, a Gitea token with package write.
  image:
    # Every check, not only the build: an image is what people run.
    needs: [build, web, check, server]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: git.unom.io/unom/punktfunk-client-web
      PUSH: ${{ github.event_name == 'push' && secrets.UNOM_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: punktfunk-web
          path: apps/web/dist
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: git.unom.io
          username: ${{ secrets.UNOM_REGISTRY_USER }}
          password: ${{ secrets.UNOM_REGISTRY_TOKEN }}
      # No tag: another run could move a shared one before `manifest` reads it.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: mkdir -p digest && echo "$DIGEST" > "digest/$ARCH"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digest/
          if-no-files-found: error
          retention-days: 1

  # One tag over this run's two digests. `edge` moves only while this commit is still main's
  # head, so an older run that finishes last leaves it alone. A tag `vX.Y.Z` gets `X.Y.Z`, and
  # `latest` too unless it is a prerelease (`-` in the version).
  manifest:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: git.unom.io/unom/punktfunk-client-web
      TOKEN: ${{ secrets.UNOM_REGISTRY_TOKEN }}
    steps:
      - if: env.TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true
      - if: env.TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: git.unom.io
          username: ${{ secrets.UNOM_REGISTRY_USER }}
          password: ${{ secrets.UNOM_REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - if: env.TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          images=("$IMAGE@$(cat digest/amd64)" "$IMAGE@$(cat digest/arm64)")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags=(-t "$IMAGE:$version")
            [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          else
            head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo "main is at $head now; its own run moves edge"
              exit 0
            fi
            tags=(-t "$IMAGE:edge")
          fi
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
