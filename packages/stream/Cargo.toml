[package]
name = "punktfunk-client-web"
description = "Browser client for punktfunk — pf-console-ui on a WebGL2 canvas, WebCodecs video over WebTransport, wasm32-unknown-emscripten."
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Enrico Bühler <enrico.buehler@unom.io>"]
repository = "https://github.com/punktfunk/client-web"

# `rust/`, not `src/`: `src/` is the TypeScript half of this package, which is the half a
# consumer sees. The crate is the engine underneath it.
[[bin]]
name = "punktfunk-client-web"
path = "rust/main.rs"

# The punktfunk crates follow the host's release tags, all three together: the client speaks that
# release's wire. Until a tag carries punktfunk#1509, v0.40.0's kit does not build for wasm and
# this is a main commit.
[dependencies]
anyhow = "1"
# The device fingerprint: SHA-256 of the WebCrypto key's SPKI, which is what the host stores.
# Already in the tree via `pake`.
sha2 = "0.11"
# `transport::Transport`, the wire codecs and the SPAKE2 ceremony. `pake`, not `quic`: the
# browser plane is WebTransport, so the ceremony is wanted and the quinn runtime under it is not.
punktfunk-core = { git = "https://git.unom.io/unom/punktfunk", rev = "3f83a4aa2ecdf0333f8719037bc84512249728ef", default-features = false, features = ["pake"] }

# wasm only. Off it this is a bin that prints how to build it, so `cargo test` on a developer's
# desktop stays green and does not resolve skia-safe for a target that wants a second Skia
# archive. `credential` and `ecdsa` are NOT in this block — see `src/main.rs`.
[target.'cfg(target_family = "wasm")'.dependencies]
# The shell itself. `default-features = false`: `vulkan-overlay` is the desktop session binary's,
# and it would put `vulkan` on skia-safe and change the prebuilt key away from
# `gl-jpegd-jpege-pdf-textlayout` — the one rust-skia publishes for this target.
pf-console-ui = { git = "https://git.unom.io/unom/punktfunk", rev = "3f83a4aa2ecdf0333f8719037bc84512249728ef", default-features = false }
# The bridge's JSON both ways: the model the page pushes, what the shell raises.
serde = "1"
serde_json = "1"
# The portable half — `trust::Settings` for the snapshot store the shell loads from.
pf-client-core = { git = "https://git.unom.io/unom/punktfunk", rev = "3f83a4aa2ecdf0333f8719037bc84512249728ef", default-features = false }
# The SAME line pf-console-ui's wasm block carries, features included: two feature sets in one
# build resolve two prebuilt keys, and the second one puts a source build of Skia on the critical
# path. Only `host.rs` names it, to build the context and wrap the canvas.
skia-safe = { version = "0.99", features = ["gl", "textlayout"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# No `doc_markdown`: it wants every capitalised noun in backticks, and the names of browser APIs
# in an ordinary sentence are prose, not code.
[lints.clippy]
cast_lossless = "warn"
map_unwrap_or = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
items_after_statements = "warn"
match_same_arms = "warn"

[profile.release]
# The payload is the constraint here, not throughput: every byte is downloaded before the console
# draws. `z` over `3` and one codegen unit, except for the per-packet path below.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Every video datagram is decrypted and FEC-checked on the page's main thread, in software. At
# `z` AES-GCM ran 46 MB/s and ChaCha20-Poly1305 168 MB/s; at `3`, 235 and 630 (wasm, V8).
[profile.release.package.punktfunk-core]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.polyval]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.universal-hash]
opt-level = 3
[profile.release.package.reed-solomon-simd]
opt-level = 3
[profile.release.package.fec-rs]
opt-level = 3
