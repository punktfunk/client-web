# Behind a reverse proxy that already does TLS (Caddy, Traefik, nginx): the page gets that
# proxy's certificate, so no browser warns. Point the proxy at http://<this machine>:8080.
#
# The page's origin is your proxy's domain: add it to each host's Browser origins (console,
# Streaming, advanced), or leave that list empty to allow any page.
#
# On networks that block UDP the page streams through this server. The host then sees every
# such stream as coming from the proxy's address, so it treats it as local.
services:
  punktfunk-web:
    image: git.unom.io/unom/punktfunk-client-web:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TLS: "off"
      LISTEN: 0.0.0.0:8080
      # Your proxy's domain. The page answers only to addresses, local names and the names here.
      # The proxy must pass the browser's Host header through unchanged (nginx:
      # `proxy_set_header Host $host;`), or the page's own requests are refused.
      TLS_NAMES: play.example.com
      # PUNKTFUNK_HOSTS: desk=192.168.1.21
    volumes:
      - punktfunk-web:/data

volumes:
  punktfunk-web:
