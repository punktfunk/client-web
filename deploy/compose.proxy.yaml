# Behind a reverse proxy that already does TLS (Caddy, Traefik, nginx): the page gets that
# proxy's certificate, so no browser warns. Point the proxy at http://<this machine>:8080.
#
# The page's origin is your proxy's domain: add it to each host's Browser origins (console,
# Streaming, advanced). A browser on a domain that isn't listed there has to pair with a PIN.
#
# The server tells each host who the visitor is, from the X-Forwarded-For or Forwarded header the
# proxy adds (nginx: `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`). A proxy
# that sends neither leaves every visitor unknown, which a host treats as the internet.
services:
  punktfunk-web:
    image: git.unom.io/unom/punktfunk-client-web:latest
    restart: unless-stopped
    network_mode: host
    environment:
      TLS: "off"
      LISTEN: 0.0.0.0:8080
      # Your proxy's domain. The page answers only to addresses, local names and the names here.
      # The proxy must pass the browser's Host header through unchanged, port included (nginx:
      # `proxy_set_header Host $http_host;`, since `$host` drops the port), or the page's own
      # requests are refused.
      TLS_NAMES: play.example.com
      # PUNKTFUNK_HOSTS: desk=192.168.1.21
    volumes:
      - punktfunk-web:/data

volumes:
  punktfunk-web:
