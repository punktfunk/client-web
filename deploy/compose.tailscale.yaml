# On your tailnet, with a real certificate from Tailscale and play from anywhere you are on it.
#
#   TS_AUTHKEY=tskey-auth-… docker compose -f compose.tailscale.yaml up -d
#   open https://punktfunk.<your tailnet>.ts.net
#
# The hosts must be on the tailnet too: the browser reaches their plane at their tailnet address.
# mDNS does not cross a tailnet, so list them.
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: punktfunk
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun
    cap_add:
      - net_admin

  punktfunk-web:
    image: git.unom.io/unom/punktfunk-client-web:latest
    restart: unless-stopped
    network_mode: service:tailscale
    environment:
      TLS: "off"
      LISTEN: 127.0.0.1:8080
      PUNKTFUNK_HOSTS: desk=100.64.0.5
    volumes:
      - punktfunk-web:/data

volumes:
  tailscale:
  punktfunk-web:
